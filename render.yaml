# Render blueprint for the VoxMind backend.
#
# Why Render and not Cloud Run (which the spec names): Cloud Run refuses to
# enable without a billing account linked to the GCP project, the same
# constraint that moved TTS off Google Cloud. Render's free tier needs no card.
# The service is a plain Docker container, so moving to Cloud Run later is just
# a `gcloud run deploy` away — nothing here is Render-specific.
#
# Values marked `sync: false` are set in the Render dashboard, not committed.

services:
  - type: web
    name: voxmind-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore # closest free region to India; keep near Firestore
    healthCheckPath: /healthz

    envVars:
      - key: ENV
        value: production

      # --- Firebase ---
      - key: FIREBASE_PROJECT_ID
        value: voxmind-504022
      # FIRESTORE_EMULATOR_HOST / FIREBASE_AUTH_EMULATOR_HOST are deliberately
      # NOT listed. The client libraries check whether they're present, not
      # whether they hold anything, so setting them to "" means "emulator at
      # address ''" and every Firestore call fails with
      # `Unknown: the target uri is not valid: dns:///`. If either is already
      # set in the dashboard, delete the variable rather than blanking it.
      # (app/firebase_app.py also strips empty values defensively.)
      # Entire service-account key JSON, pasted in the dashboard.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # --- CORS ---
      # Both Firebase Hosting domains for the project.
      - key: ALLOWED_ORIGINS
        value: https://voxmind-504022.web.app,https://voxmind-504022.firebaseapp.com

      # Render terminates TLS at a proxy, so the real client IP arrives in
      # X-Forwarded-For. Without this every request rate-limits against the
      # proxy's IP as a single shared bucket.
      - key: BEHIND_PROXY
        value: "true"

      # --- Secrets (set in dashboard) ---
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Preferred email transport — Render free web services block outbound
      # SMTP ports, so the HTTP API is the only one that works here.
      - key: BREVO_API_KEY
        sync: false

      # Signs the short-lived tickets that let a browser poll camera frames
      # without a Firestore read per request (see services/device_runtime.py).
      # generateValue makes Render mint a random value once and keep it across
      # deploys — nothing to paste, and it never lands in the repo. If this is
      # unset the ticket endpoint returns 503 rather than skipping the
      # signature, so a missing value fails loudly instead of silently opening
      # the stream up.
      - key: STREAM_TICKET_SECRET
        generateValue: true

      # --- Non-secret config ---
      # llama-3.3-70b-versatile was pinned here and Groq deprecated it on
      # 2026-06-17 (free/developer tier) — calls started failing with
      # `404 model_not_found`, which chat.py's fallback chain silently ate by
      # dropping straight to Gemini, so nothing looked wrong until Gemini also
      # broke (see GEMINI_MODEL below) and both providers failing at once
      # surfaced the 502. openai/gpt-oss-120b is Groq's own recommended
      # replacement for the 70B-class model. A dashboard-only edit to this
      # value doesn't survive a Blueprint sync since it isn't `sync: false` —
      # it has to change here.
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Deliberately an alias, not a pinned version. gemini-2.5-flash was
      # pinned here and started returning
      # `404 ... no longer available to new users` in production — it still
      # appears in the API's list_models() call, so nothing looked wrong until
      # a real request actually needed the fallback. This alias tracks
      # whatever Gemini currently calls their stable Flash model and can't rot
      # the same way. A dashboard-only edit to this value doesn't survive a
      # Blueprint sync since it isn't `sync: false` — it has to change here.
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: ELEVENLABS_VOICE_ID
        value: pNInz6obpgDQGcFmaJgB
      - key: ELEVENLABS_MODEL_ID
        value: eleven_v3
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_FROM
        sync: false
