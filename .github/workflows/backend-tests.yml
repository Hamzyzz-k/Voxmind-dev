name: Backend tests

# Only the backend path, not on every frontend-only commit — a CSS tweak
# should not wait on a Python test run that cannot possibly have broken.
on:
  push:
    branches: [master]
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    branches: [master]
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # No Firebase credentials, no GROQ/GEMINI/ELEVENLABS keys, no ffmpeg or
      # espeak-ng. That is deliberate, not an oversight: the suite is unit
      # tests over pure functions and small services (device_auth, otp,
      # prompt building, rate limiting, ...), and none of them import
      # app.main or call firebase_admin.initialize_app(). Adding real
      # credentials here would let a test accidentally start depending on a
      # live service, which is exactly the failure mode a CI suite exists to
      # catch, not invite.
      - run: pytest -q
